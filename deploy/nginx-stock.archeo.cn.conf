# /etc/nginx/sites-available/stock.archeo.cn
#
# Nginx 在这里只做两件事：
#   1. 托管静态文件（root 指向 current 软链，发布时只切软链，这个文件不用改）
#   2. 把 /api/ 和 /health 反代给 pm2 里的 Node 进程（127.0.0.1:8787）
#
# 与旧部署文档的区别：那个模板把整站当纯静态站，本项目的 /api/* 必须由 Node 处理，
# 否则前端拿到的是 index.html 而不是 JSON。另外旧模板对未加哈希的 js/css 设了
# 30 天 immutable，会让用户在发版后继续跑旧 JS。

upstream stockanalysis_node {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name stock.archeo.cn;

    # certbot --nginx 会自动在本文件里补出 443 配置并加 301 跳转

    root /srv/apps/stockanalysis/current;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---- 接口：反代给 Node ----
    location /api/ {
        proxy_pass http://stockanalysis_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 必须用 $remote_addr 覆盖，不能用 $proxy_add_x_forwarded_for 追加：
        # agent-server.js 直接信任 X-Forwarded-For 的第一个值，追加会让客户端伪造的 IP
        # 通过，从而绕过按 IP 的限流（/api/stock 30 次/分、/api/llm 20 次/分）。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/llm 最长 45s（LLM_TIMEOUT_MS），/api/brief-context 还会串行补充公开信息
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        client_max_body_size 2m;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://stockanalysis_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # ---- 静态资源 ----
    # index.html / app.js / styles.css 都没有内容哈希，必须每次回源校验，
    # 否则发版后浏览器会继续用缓存里的旧 JS。Nginx 默认带 ETag，304 开销很小。
    location ~* \.(?:js|css|html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:png|jpe?g|gif|svg|ico|webp|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
